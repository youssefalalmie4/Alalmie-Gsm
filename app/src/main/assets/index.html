function translateText(s){const lang=load('smp_language','ar'),q=String(s).trim();let v=lang==='en'?englishUI[q]:Object.entries(englishUI).find(([,en])=>en===q)?.[0];if(!v&&lang==='en'&&q.startsWith('نتائج قسم '))v='Results for '+(englishUI[q.slice(10)]||q.slice(10));if(!v&&lang==='en'&&/^\d+ نتيجة$/.test(q))v=q.replace(' نتيجة',' results');return v?String(s).replace(q,v):s}function translateUI(){const lang=load('smp_language','ar');document.documentElement.lang=lang;document.documentElement.dir=lang==='en'?'ltr':'rtl';document.body.classList.toggle('english',lang==='en');const w=document.createTreeWalker(document.body,NodeFilter.SHOW_TEXT);while(w.nextNode()){const n=w.currentNode;n.nodeValue=translateText(n.nodeValue)}document.querySelectorAll('[placeholder],[title],[aria-label]').forEach(e=>['placeholder','title','aria-label'].forEach(a=>{if(e.hasAttribute(a))e.setAttribute(a,translateText(e.getAttribute(a)))}))}function setLanguage(lang){save('smp_language',lang==='en'?'en':'ar');render();showToast(lang==='en'?'Language changed to English':'تم تغيير اللغة إلى العربية')}

function morePage(){let links=[['history','◷','السجل'],['compare','⇄','المقارنة'],['inventory','▤','المخزون'],['updates','⟳','التحديثات'],['settings','⚙','الإعدادات'],['research','⌕','المصادر والتحقق']];return `${head('المزيد','السجل والمقارنة والمخزون والإعدادات')}<div class="card more-grid">${links.map(([id,icon,label])=>`<button class="btn more-link" onclick="navigate('${id}')"><span class="more-icon">${icon}</span><span>${label}</span><b>‹</b></button>`).join('')}</div>`}
function researchPage(){let en=load('smp_language','ar')==='en',t=(ar,eng)=>en?eng:ar;let s=[
['المحترف','Al-Mohtarif','مرجع عربي للتوافقات','Arabic compatibility reference','https://mhtref.com/compatibilities/search','يعلن عن 6,572 هاتفًا و35,368 توافقًا في ست فئات: الشاشة، الاسكرينة، البطارية، البصمة، سوكت الشحن وفلاتة الشحن.','Reports 6,572 phones and 35,368 fitments in six categories: display, protector, battery, fingerprint, charging socket and charging flex.','الأعداد وطريقة المراجعة معلنة من الموقع؛ لم أجد توثيقًا عامًا لمصدر كل سجل أو API للتصدير.','Counts and review claims are self-reported; no public record-level sources or export API found.'],
['Mobile Parts Finder','Mobile Parts Finder','كتالوج توافق باشتراك','Paid compatibility catalog','https://www.mobilepartsfinder.com/finder','يعلن عن 4,933 موديلًا و12,345 توافقًا عبر 22 علامة. يغطي الشاشة والبطارية والفريم ولوحة الشحن والغطاء وغيرها. الاشتراك المعلن ₹99 شهريًا أو ₹799 سنويًا.','Reports 4,933 models and 12,345 fitments across 22 brands, including display, battery, frame, charge board and cover. Listed pricing: ₹99/month or ₹799/year.','التسجيل في الكتالوج لا يثبت اختبار كل قطعة، ولم أجد إذنًا لإعادة نشر القاعدة كاملة.','Catalog entries do not prove every part was tested; no permission to republish the full dataset was found.'],
['Partsivo','Partsivo','كتالوج مجاني يعتمد قوائم موردين','Free catalog using supplier listings','https://partsivo.com/how-we-verify','يغطي شاشات وبطاريات وكاميرات وفريمات وفلاتات وسماعات وغيرها، والبحث باسم الجهاز أو كود القطعة.','Covers screens, batteries, cameras, frames, flex cables, speakers and more; search by device or part code.','الموقع يصرّح أن كثيرًا من الروابط مصدرها قائمة مورد واحدة وأن المراجعة لم تكتمل لكل الفئات.','The site says many links rely on one supplier listing and category review is not finished.'],
['GSM Iraq','GSM Iraq','نظام توافق للفنيين','Technician compatibility system','https://hardware.gsm-iraq.com/','يذكر توافقات شاشات وبطاريات وفلاتات ودوائر IC لماركات منها Samsung وiPhone وInfinix.','Advertises display, battery, flex and IC compatibility for brands including Samsung, iPhone and Infinix.','البحث يتطلب تسجيل دخول؛ لم أجد شرحًا عامًا كافيًا للتحقق أو ترخيص البيانات.','Search requires login; no adequate public verification method or data license found.'],
['ComboDekho','ComboDekho','دليل توافق موجّه للسوق الهندي','India-focused compatibility finder','https://www.combodekho.com/search','يعلن عن توافقات الشاشة واللمس والبطارية والكاميرات وسوكت الشحن والسماعات والمايك والفلاتات.','Advertises display, touch, battery, camera, charging port, speaker, microphone and flex compatibility.','صفحة البحث لا تشرح مصدر السجلات أو طريقة التحقق؛ يستخدم للمقارنة فقط.','The search page does not explain record sources or verification; use for comparison only.'],
['The Digital Friends','The Digital Friends','بحث شاشة وبطارية مع تصويت المستخدمين','Display and battery finder with user votes','https://thedigitalfriends.com/parts','يسمح بالبحث باسم الهاتف أو كود البطارية ويميّز قوائم راجعها الموقع عن قوائم أكدها المستخدمون. ينبه لاختلاف الفريم وموصل FPC.','Search by phone or battery code; distinguishes site-checked from user-confirmed lists and warns about frame and FPC connector differences.','درجات التحقق يعرّفها الموقع نفسه ولا تعادل إثبات الشركة المصنّعة.','Verification labels are defined by the site and are not manufacturer proof.'],
['Samsung Self-Repair','Samsung Self-Repair','قطع وأدلة رسمية لموديلات محددة','Official parts and guides for selected models','https://www.samsung.com/us/support/self-repair/','يوفر سامسونج قطعًا أصلية وأدلة بعد اختيار الموديل، ويذكر أن بعض القطع قد تحتاج معايرة.','Samsung provides genuine parts and guides after selecting a model; some parts may require calibration.','قوي لتأكيد القطعة للموديل المختار، لكنه ليس جدول توافق شاملًا بين الموديلات.','Strong for the selected model’s parts, but not a cross-model fitment table.'],
['Apple Self Service Repair','Apple Self Service Repair','قطع وأدلة حسب موديل المنتج','Model-specific parts and manuals','https://support.apple.com/self-service-repair','يوفر قطعًا وأدوات وأدلة أصلية لموديلات مؤهلة؛ القطع مصممة لكل منتج.','Provides genuine parts, tools and manuals for eligible models; parts are tailored per product.','مرجع رسمي للموديل المحدد وليس قاعدة توافق عامة.','Official for the specific model, not a general compatibility database.'],
['GSMArena','GSMArena','مواصفات الأجهزة','Device specifications','https://www.gsmarena.com/m/faq.php3','مفيد لمواصفات الهاتف. الموقع يوضح أن دوره معلومات الأجهزة ولا يقدم إصلاحًا.','Useful for phone specifications. The site says it provides device information, not repair services.','تشابه المواصفات لا يثبت توافق قطعة غيار.','Similar specifications do not establish spare-part compatibility.'],
['MobiMatch Pro','MobiMatch Pro','منهجية يذكرها الموقع ذاتيًا','Self-described methodology','https://www.mobimatchpro.com/about','يقول إنه يجمع البيانات من اختبار ورش وملصقات قطع الموردين وأرقام قطع الخدمة وأدلة التفكيك.','Says it compiles data from repair-lab tests, supplier labels, service part numbers and teardown guides.','المنهجية والتغطية معلنة من الموقع نفسه؛ يلزم فحص دليل كل سجل قبل اعتماده.','Methodology and coverage are self-reported; each record needs evidence review.']
];let cards=s.map(x=>`<article class="card source-card"><div class="source-top"><div><h3>${t(x[0],x[1])}</h3><span class="pill">${t(x[2],x[3])}</span></div><a class="btn" href="${x[4]}" onclick="return openSource(this.href)">${t('فتح المصدر ↗','Open source ↗')}</a></div><p>${t(x[5],x[6])}</p><div class="source-caveat"><b>${t('حدود الاعتماد:','Evidence limits:')}</b> ${t(x[7],x[8])}</div></article>`).join('');return `${head(t('مصادر البيانات والتحقق','Data sources & verification'),t('المراجع التي راجعناها وما الذي يثبته كل مصدر','Reviewed references and what each can establish'))}<div class="card source-intro"><b>${t('مراجعة المصادر: 1 نوفمبر 2026','Sources reviewed: 1 Nov 2026')}</b><p>${t('الأعداد والادعاءات منقولة عن المواقع نفسها. لم نستورد قواعد بياناتها أو نضف توافقات جديدة تلقائيًا.','Counts and claims are reported by the sites themselves. Their databases were not imported and no new fitments were added automatically.')}</p><div class="notice">${t('قائمة البائع ليست اختبارًا. افحص كود القطعة والنسخة والموصل والفريم. مواصفات GSMArena لا تثبت توافق القطعة.','A seller listing is not a test. Check part code, variant, connector and frame. GSMArena specifications do not prove fitment.')}</div></div><div class="source-grid">${cards}</div><div class="card"><h3>${t('درجات الدليل المقترحة','Suggested evidence levels')}</h3><div class="detailgrid"><div class="detailcell"><small>${t('رسمي / موثق','Official / documented')}</small><strong>${t('رقم قطعة أو دليل إصلاح يطابق موديل الجهاز.','Part number or repair manual matching the exact device model.')}</strong></div><div class="detailcell"><small>${t('مجرّب فنيًا','Technician tested')}</small><strong>${t('إصلاح فعلي موثق بالموديل وكود القطعة.','A real repair recorded with model and part code.')}</strong></div><div class="detailcell"><small>${t('مذكور لدى مورد','Supplier listed')}</small><strong>${t('ادعاء كتالوج بائع؛ منفصل عن الاختبار.','Seller catalog claim; separate from testing.')}</strong></div><div class="detailcell"><small>${t('غير مؤكد','Unconfirmed')}</small><strong>${t('لا يوجد دليل كافٍ؛ لا يعرض كتوصية تركيب.','Insufficient evidence; not shown as a repair recommendation.')}</strong></div></div></div>`}
function openSource(url){if(window.NativeApp?.openExternal){window.NativeApp.openExternal(url);return false}return true}
function accountPage(){return `${head('حسابي','بيانات ملفك الشخصي داخل التطبيق')}<div class="card"><form class="formgrid" onsubmit="saveAccountForm(event)"><div class="formrow full"><label for="accountName">الاسم</label><input id="accountName" class="field" name="name" value="${esc(account.name)}" placeholder="اكتب اسمك"></div><div class="formrow full"><label for="accountShop">اسم المحل أو النشاط</label><input id="accountShop" class="field" name="shop" value="${esc(account.shop)}" placeholder="اختياري"></div><div class="formrow"><label for="accountPhone">رقم الهاتف</label><input id="accountPhone" class="field" name="phone" type="tel" value="${esc(account.phone)}" placeholder="اختياري"></div><div class="formrow"><label for="accountEmail">البريد الإلكتروني</label><input id="accountEmail" class="field" name="email" type="email" value="${esc(account.email)}" placeholder="اختياري"></div><div class="formrow full"><button class="primary" type="submit">حفظ بيانات الحساب</button></div></form></div><div class="notice">بيانات الحساب تُحفظ على هذا الجهاز في المعاينة. تسجيل الدخول والمزامنة بين الأجهزة غير مفعّلين.</div>`}
function categoryPage(){let filtered=data.filter(p=>p.category===activeFilter&&(!searchTerm||Object.values(p).join(' ').toLowerCase().includes(searchTerm.toLowerCase())));return `${head(activeFilter,`نتائج قسم ${activeFilter}`,`<button class="btn" onclick="navigate('home')">كل الأقسام</button><button class="btn" onclick="navigate('search')">البحث العام</button>`)}<div class="card"><div class="filters"><input class="field" id="localQuery" value="${esc(searchTerm)}" placeholder="بحث داخل القسم" oninput="setQuery(this.value)"><button class="btn" onclick="clearCategoryQuery()">مسح البحث</button></div><div class="subtle">${filtered.length} نتيجة</div>${listResults(filtered)}${demoNotice()}</div>`}
function clearCategoryQuery(){searchTerm='';render()}
function saveAccountForm(event){event.preventDefault();const form=new FormData(event.currentTarget);account={name:form.get('name').trim(),shop:form.get('shop').trim(),phone:form.get('phone').trim(),email:form.get('email').trim()};save('smp_account',account);showToast('تم حفظ بيانات الحساب على هذا الجهاز')}
function homePage(){let recent=[...data].sort((a,b)=>b.date.localeCompare(a.date)).slice(0,3);return `${head('الرئيسية','مرحبًا بك في دليل التوفيقات',`<button class="btn" onclick="navigate('report')">إبلاغ عن خطأ</button>`)}<div class="stats"><div class="stat"><strong>${data.length}</strong><span>سجلات توضيحية</span></div><div class="stat"><strong>${favorites.length}</strong><span>في المفضلة</span></div><div class="stat"><strong>${inventory.length}</strong><span>أصناف المخزون</span></div></div><div class="card"><div class="pagehead"><div><h2 style="font-size:14px">أقسام قطع الغيار</h2><p>اختر قسمًا لعرض نتائج المعاينة</p></div></div><div class="category-grid">${cats.map(c=>`<button class="btn category-tile" onclick="openCategory('${c}')"><span class="category-icon">${iconCat(c)}</span><span>${c}</span></button>`).join('')}</div></div><div class="card"><div class="pagehead"><div><h2 style="font-size:14px">آخر الإضافات</h2><p>أحدث سجلات العينة</p></div><button class="linkbtn btn" onclick="navigate('additions')">عرض الكل</button></div>${listResults(recent)}</div>${demoNotice()}`}
function searchPage(){let filtered=data.filter(p=>(activeFilter==='الكل'||p.category===activeFilter)&&(!searchTerm||Object.values(p).join(' ').toLowerCase().includes(searchTerm.toLowerCase())));return `${head('البحث الذكي',searchTerm?`نتائج البحث عن «${esc(searchTerm)}»`:'ابحث باسم الموديل أو كود القطعة أو الشركة',`<button class="btn" onclick="navigate('compare')">المقارنة (${compare.length}/2)</button><button class="btn" onclick="addCompatibilityForm()">＋ إضافة توفيق</button><button class="btn" onclick="exportCompatibility()">تصدير التوفيقات</button><label class="btn">استيراد JSON<input type="file" accept="application/json" hidden onchange="importCompatibility(this)"></label>`)}<div class="card"><div class="filters"><select id="catFilter" onchange="setFilter(this.value)"><option>الكل</option>${cats.map(c=>`<option ${activeFilter===c?'selected':''}>${c}</option>`).join('')}</select><input class="field" id="localQuery" value="${esc(searchTerm)}" placeholder="اسم الموديل أو كود القطعة" oninput="setQuery(this.value)"><button class="btn" onclick="clearFilters()">مسح التصفية</button><button class="btn" onclick="navigate('code')">⌗ بحث بالكود</button><button class="btn" onclick="navigate('image')">▧ بحث بالصورة</button></div>${listResults(filtered)}${demoNotice()}</div>`}
function addCompatibilityForm(){openModal('إضافة توفيق للمراجعة',`<form id="compatform" class="formgrid"><div class="formrow"><label>اسم الجهاز</label><input class="field" name="model" required placeholder="اسم الشركة والموديل"></div><div class="formrow"><label>كود الموديل الدقيق</label><input class="field" name="deviceCode" required placeholder="مثال: RMX3686"></div><div class="formrow"><label>النسخة أو السوق</label><input class="field" name="region" placeholder="مثال: عالمي / مصر"></div><div class="formrow"><label>القسم</label><select name="category">${cats.map(c=>`<option>${esc(c)}</option>`).join('')}</select></div><div class="formrow"><label>اسم القطعة</label><input class="field" name="part" required></div><div class="formrow"><label>كود القطعة</label><input class="field" name="code" required></div><div class="formrow"><label>مصدر المعلومة</label><select name="sourceType"><option>كتالوج مورد</option><option>دليل الشركة</option><option>تجربة تركيب</option></select></div><div class="formrow"><label>رابط المصدر</label><input class="field" name="sourceUrl" type="url" required></div><div class="formrow full"><label>دليل التحقق (نتيجة تجربة، ملاحظة فنية، أو مرجع محدد)</label><textarea class="field" name="evidence" required></textarea></div><div class="formrow full"><button class="primary">حفظ للمراجعة</button></div></form>`);document.getElementById('compatform').onsubmit=e=>{e.preventDefault();let f=Object.fromEntries(new FormData(e.target));let row={id:'local-'+Date.now(),category:f.category,icon:iconCat(f.category),model:f.model.trim(),deviceCode:f.deviceCode.trim(),region:f.region.trim(),part:f.part.trim(),code:f.code.trim(),fit:'قيد المراجعة',level:'conditional',date:new Date().toISOString().slice(0,10),notes:f.sourceType+' — '+f.evidence.trim(),source:f.sourceType,url:f.sourceUrl.trim(),verified:false};data.unshift(row);persist();closeModal();current='search';render();showToast('أضيف التوفيق محليًا بحالة قيد المراجعة')}}
function exportCompatibility(){download(new Blob([JSON.stringify({data},null,2)],{type:'application/json'}),'smart-match-compatibility.json')}
function importCompatibility(input){let f=input.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result),rows=Array.isArray(x)?x:x.data;if(!Array.isArray(rows))throw Error('invalid');for(const row of rows){if(!row.model||!row.part||!row.code)continue;let i=data.findIndex(d=>d.id===row.id||(d.deviceCode&&d.deviceCode===row.deviceCode&&d.code===row.code));if(i<0)data.push(row);else data[i]=row}persist();render();showToast('تم استيراد التوفيقات')}catch{showToast('ملف غير صالح؛ استخدم JSON يحوي data')}};r.readAsText(f)}function gsmPage(){return `${head('GSM','اكتب كود الموديل لعرض مواصفات الجهاز المسجلة في قاعدة GSM',`<button class="btn" onclick="exportGsm()">تصدير قاعدة GSM</button><label class="btn">استيراد JSON<input type="file" accept="application/json" hidden onchange="importGsmData(this)"></label><button class="primary" onclick="gsmForm()">＋ إضافة موديل</button>`)}<div class="card"><div class="filters"><input id="gsmQuery" class="field" style="flex:1" placeholder="مثال: RMX3686 أو SM-A546U" oninput="searchGsm(this.value)"></div><div id="gsmResults">${gsmCards('')}</div><div class="notice">المواصفات تختلف حسب السوق والنسخة. راجع كود الجهاز ومصدر كل سجل قبل الاعتماد عليه. قاعدة GSM الحالية بداية قابلة للاستيراد والتوسعة وليست قائمة كاملة بكل الهواتف.</div></div>`}
function gsmCards(q){let term=(q||'').trim().toLowerCase(),matches=gsmDevices.filter(d=>!term||[d.code,d.name,d.brand,...(d.aliases||[])].join(' ').toLowerCase().includes(term));if(!matches.length)return '<div class="empty">لم نجد هذا الكود في قاعدة GSM بعد. أضف سجلًا موثقًا أو استورد قاعدة JSON.</div>';return `<div class="results">${matches.map(d=>`<article class="card gsmcard"><div class="pagehead"><div><h2 style="font-size:16px">${esc(d.name)}</h2><p>${esc(d.brand)} · كود الموديل: <b>${esc(d.code)}</b>${d.region?' · '+esc(d.region):''}</p></div><span class="badge confirmed">مواصفات مسجلة</span></div><div class="detailgrid">${d.specs.map(([label,value])=>`<div class="detailcell"><small>${esc(label)}</small><strong>${esc(value)}</strong></div>`).join('')}</div><div class="notice">المصدر: <a href="${esc(d.url)}" target="_blank" rel="noopener">${esc(d.source)}</a> · ${esc(d.verified||'يحتاج مراجعة')}</div></article>`).join('')}</div>`}
function searchGsm(q){let el=document.getElementById('gsmResults');if(el){el.innerHTML=gsmCards(q);translateUI()}}
function gsmForm(){openModal('إضافة موديل إلى GSM',`<form id="gsmform" class="formgrid"><div class="formrow"><label>كود الموديل الدقيق</label><input class="field" name="code" required placeholder="مثال: SM-A546U"></div><div class="formrow"><label>الشركة والموديل</label><input class="field" name="name" required placeholder="Samsung Galaxy ..."></div><div class="formrow"><label>السوق أو النسخة</label><input class="field" name="region" placeholder="مثال: مصر / عالمي / US"></div><div class="formrow"><label>المعالج</label><input class="field" name="chipset"></div><div class="formrow"><label>معالج الرسوميات (GPU)</label><input class="field" name="gpu"></div><div class="formrow"><label>الرام والتخزين</label><input class="field" name="memory" placeholder="8GB / 256GB"></div><div class="formrow"><label>الشاشة</label><input class="field" name="display" placeholder="النوع والمقاس والدقة والتحديث"></div><div class="formrow"><label>الكاميرات</label><input class="field" name="camera"></div><div class="formrow"><label>البطارية والشحن</label><input class="field" name="battery"></div><div class="formrow"><label>الاتصال والشبكات</label><input class="field" name="connectivity"></div><div class="formrow"><label>الأبعاد والوزن والحماية</label><input class="field" name="physical"></div><div class="formrow"><label>إصدار النظام</label><input class="field" name="os"></div><div class="formrow full"><label>رابط مصدر المواصفات</label><input class="field" name="url" type="url" required placeholder="رابط رسمي أو مرخّص"></div><div class="formrow full"><button class="primary">حفظ موديل GSM</button></div></form>`);document.getElementById('gsmform').onsubmit=e=>{e.preventDefault();let f=Object.fromEntries(new FormData(e.target));let specs=[['المعالج',f.chipset],['معالج الرسوميات',f.gpu],['الذاكرة والتخزين',f.memory],['الشاشة',f.display],['الكاميرات',f.camera],['البطارية والشحن',f.battery],['الاتصال والشبكات',f.connectivity],['الأبعاد والوزن والحماية',f.physical],['النظام',f.os]].filter(x=>x[1]);let item={code:f.code.trim(),region:f.region.trim(),aliases:[],brand:f.name.split(' ')[0],name:f.name.trim(),specs,source:'مصدر مضاف يدويًا',url:f.url.trim(),verified:'مصدر المستخدم — يلزم مراجعته'};let at=gsmDevices.findIndex(d=>d.code.toLowerCase()===item.code.toLowerCase());if(at>=0)gsmDevices[at]=item;else gsmDevices.unshift(item);persist();closeModal();render();showToast('تم حفظ الموديل في قاعدة GSM المحلية')}}
function exportGsm(){download(new Blob([JSON.stringify({devices:gsmDevices},null,2)],{type:'application/json'}),'smart-match-gsm-devices.json')}

function exportInventory(){let rows=[['القطعة','الكود','الكمية','السعر'],...inventory.map(x=>[x.name,x.code,x.qty,x.price])];download(new Blob(['\ufeff'+rows.map(r=>r.map(v=>'"'+String(v??'').replaceAll('"','""')+'"').join(',')).join('\n')],{type:'text/csv;charset=utf-8'}),'smart-match-inventory.csv')}
function download(blob,name){let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function importData(input){let f=input.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result);data=x.data||data;favorites=x.favorites||[];history=x.history||[];inventory=x.inventory||[];reports=x.reports||[];compare=x.compare||[];if(Array.isArray(x.gsmDevices))gsmDevices=x.gsmDevices;if(x.preferences){save('smp_dark',!!x.preferences.dark);save('smp_appearance',x.preferences.appearance||(x.preferences.dark?'dark':'light'));save('smp_theme',x.preferences.theme||'blue');save('smp_font_size',x.preferences.fontSize||'medium');save('smp_glass',!!x.preferences.glass);save('smp_motion_off',!!x.preferences.motionOff);if(x.preferences.reviewReminder){reviewReminder=x.preferences.reviewReminder;save('smp_review_reminder',reviewReminder)}applyAppearance();applyTheme(x.preferences.theme||'blue');applyFontSize();document.body.classList.toggle('glass-ui',!!x.preferences.glass);document.body.classList.toggle('motion-off',!!x.preferences.motionOff)}persist();render();showToast('تم استعادة النسخة')}catch{showToast('تعذر قراءة ملف النسخة')}};r.readAsText(f)}
function resetDemo(){if(!confirm('استعادة سجلات المعاينة الأصلية ومسح بياناتك المحلية؟'))return;data=initial;favorites=[];history=[];inventory=[];reports=[];compare=[];persist();render();showToast('تمت استعادة بيانات المعاينة')}
function sharePart(id){let p=data.find(x=>x.id===id),txt=`${p.model} — ${p.part} (${p.code})\n${p.fit}\nمعلومة تجريبية للمعاينة وليست توصية تركيب.`;if(navigator.share)navigator.share({title:'Smart Match Pro',text:txt}).catch(()=>{});else navigator.clipboard?.writeText(txt).then(()=>showToast('تم نسخ تفاصيل النتيجة'))||showToast('المشاركة غير متاحة في هذا المتصفح')}
document.addEventListener('submit',e=>{if(e.target.id==='reportForm'){e.preventDefault();let f=new FormData(e.target);reports.unshift({...Object.fromEntries(f),date:new Date().toLocaleString('ar-EG')});persist();e.target.reset();showToast('تم حفظ البلاغ محليًا في المعاينة')}});
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
applyAppearance();applyTheme();applyFontSize();document.body.classList.toggle('glass-ui',load('smp_glass',false));document.body.classList.toggle('motion-off',load('smp_motion_off',false));render();checkReviewReminder();
</script>
</body></html>
