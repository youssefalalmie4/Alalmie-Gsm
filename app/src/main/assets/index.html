function head(h,sub,acts=''){return `<div class="pagehead"><div><h2>${h}</h2><p>${sub}</p></div><div class="actions">${acts}</div></div>`}
function listResults(items){if(!items.length)return `<div class="empty">لا توجد نتائج هنا بعد. جرّب البحث أو تغيير التصفية.</div>`;return `<div class="results">${items.map(p=>resultCard(p)).join('')}</div>`}
function resultCard(p){let fav=favorites.includes(p.id),cmp=compare.includes(p.id);return `<article class="result"><div class="particon">${p.icon||'⚙'}</div><div class="resultmain" onclick="detail('${p.id}')" style="cursor:pointer"><strong>${esc(p.model)} ← ${esc(p.part)}</strong><small>${esc(p.category)}　·　موديل ${esc(p.deviceCode||p.model)}　·　قطعة ${esc(p.code)}${p.region?'　·　'+esc(p.region):''}　·　${esc(p.date||'—')}　·　${p.url?`<a href="${esc(p.url)}" onclick="event.stopPropagation();return openSource(this.href)">${esc(p.source||'المصدر')} ↗</a>`:esc(p.source||'مصدر غير محدد')}</small></div><span class="badge ${p.level||'uncertain'}">${esc(p.fit||'غير مؤكد')}</span><div class="resultactions"><button class="tiny ${fav?'on':''}" title="المفضلة" onclick="toggleFav('${p.id}')">${fav?'★':'☆'}</button><button class="tiny ${cmp?'on':''}" title="إضافة للمقارنة" onclick="toggleCompare('${p.id}')">⇄</button><button class="tiny" title="التفاصيل" onclick="detail('${p.id}')">↗</button></div></article>`}
function demoNotice(){return `<div class="notice"><span>ⓘ</span><span>هذه النتائج مأخوذة من قوائم موردين أو مراجع منشورة؛ قائمة المورد ليست اختبارًا فنيًا. طابق كود الموديل والقطعة والموصل والإطار مع القطعة الأصلية قبل التركيب.</span></div>`}
function renderPage(){switch(current){case'home':return homePage();case'more':return morePage();case'research':return researchPage();case'account':return accountPage();case'category':return categoryPage();case'search':return searchPage();case'gsm':return gsmPage();case'code':return codePage();case'image':return imagePage();case'favorites':return favoritesPage();case'history':return historyPage();case'compare':return comparePage();case'inventory':return inventoryPage();case'updates':return updatesPage();case'settings':return settingsPage();case'additions':return additionsPage();case'report':return reportPage();default:return homePage()}}
function morePage(){let links=[['history','◷','السجل'],['compare','⇄','المقارنة'],['inventory','▤','المخزون'],['updates','⟳','التحديثات'],['settings','⚙','الإعدادات'],['research','⌕','المصادر والتحقق']];return `${head('المزيد','السجل والمقارنة والمخزون والإعدادات')}<div class="card more-grid">${links.map(([id,icon,label])=>`<button class="btn more-link" onclick="navigate('${id}')"><span class="more-icon">${icon}</span><span>${label}</span><b>‹</b></button>`).join('')}</div>`}
function researchPage(){let en=load('smp_language','ar')==='en',t=(ar,eng)=>en?eng:ar;let s=[
['المحترف','Al-Mohtarif','مرجع عربي للتوافقات','Arabic compatibility reference','https://mhtref.com/compatibilities/search','يعلن عن 6,572 هاتفًا و35,368 توافقًا في ست فئات: الشاشة، الاسكرينة، البطارية، البصمة، سوكت الشحن وفلاتة الشحن.','Reports 6,572 phones and 35,368 fitments in six categories: display, protector, battery, fingerprint, charging socket and charging flex.','الأعداد وطريقة المراجعة معلنة من الموقع؛ لم أجد توثيقًا عامًا لمصدر كل سجل أو API للتصدير.','Counts and review claims are self-reported; no public record-level sources or export API found.'],
['Mobile Parts Finder','Mobile Parts Finder','كتالوج توافق باشتراك','Paid compatibility catalog','https://www.mobilepartsfinder.com/finder','يعلن عن 4,933 موديلًا و12,345 توافقًا عبر 22 علامة. يغطي الشاشة والبطارية والفريم ولوحة الشحن والغطاء وغيرها. الاشتراك المعلن ₹99 شهريًا أو ₹799 سنويًا.','Reports 4,933 models and 12,345 fitments across 22 brands, including display, battery, frame, charge board and cover. Listed pricing: ₹99/month or ₹799/year.','التسجيل في الكتالوج لا يثبت اختبار كل قطعة، ولم أجد إذنًا لإعادة نشر القاعدة كاملة.','Catalog entries do not prove every part was tested; no permission to republish the full dataset was found.'],
['Partsivo','Partsivo','كتالوج مجاني يعتمد قوائم موردين','Free catalog using supplier listings','https://partsivo.com/how-we-verify','يغطي شاشات وبطاريات وكاميرات وفريمات وفلاتات وسماعات وغيرها، والبحث باسم الجهاز أو كود القطعة.','Covers screens, batteries, cameras, frames, flex cables, speakers and more; search by device or part code.','الموقع يصرّح أن كثيرًا من الروابط مصدرها قائمة مورد واحدة وأن المراجعة لم تكتمل لكل الفئات.','The site says many links rely on one supplier listing and category review is not finished.'],
['GSM Iraq','GSM Iraq','نظام توافق للفنيين','Technician compatibility system','https://hardware.gsm-iraq.com/','يذكر توافقات شاشات وبطاريات وفلاتات ودوائر IC لماركات منها Samsung وiPhone وInfinix.','Advertises display, battery, flex and IC compatibility for brands including Samsung, iPhone and Infinix.','البحث يتطلب تسجيل دخول؛ لم أجد شرحًا عامًا كافيًا للتحقق أو ترخيص البيانات.','Search requires login; no adequate public verification method or data license found.'],
['ComboDekho','ComboDekho','دليل توافق موجّه للسوق الهندي','India-focused compatibility finder','https://www.combodekho.com/search','يعلن عن توافقات الشاشة واللمس والبطارية والكاميرات وسوكت الشحن والسماعات والمايك والفلاتات.','Advertises display, touch, battery, camera, charging port, speaker, microphone and flex compatibility.','صفحة البحث لا تشرح مصدر السجلات أو طريقة التحقق؛ يستخدم للمقارنة فقط.','The search page does not explain record sources or verification; use for comparison only.'],
['The Digital Friends','The Digital Friends','بحث شاشة وبطارية مع تصويت المستخدمين','Display and battery finder with user votes','https://thedigitalfriends.com/parts','يسمح بالبحث باسم الهاتف أو كود البطارية ويميّز قوائم راجعها الموقع عن قوائم أكدها المستخدمون. ينبه لاختلاف الفريم وموصل FPC.','Search by phone or battery code; distinguishes site-checked from user-confirmed lists and warns about frame and FPC connector differences.','درجات التحقق يعرّفها الموقع نفسه ولا تعادل إثبات الشركة المصنّعة.','Verification labels are defined by the site and are not manufacturer proof.'],
['Samsung Self-Repair','Samsung Self-Repair','قطع وأدلة رسمية لموديلات محددة','Official parts and guides for selected models','https://www.samsung.com/us/support/self-repair/','يوفر سامسونج قطعًا أصلية وأدلة بعد اختيار الموديل، ويذكر أن بعض القطع قد تحتاج معايرة.','Samsung provides genuine parts and guides after selecting a model; some parts may require calibration.','قوي لتأكيد القطعة للموديل المختار، لكنه ليس جدول توافق شاملًا بين الموديلات.','Strong for the selected model’s parts, but not a cross-model fitment table.'],
['Apple Self Service Repair','Apple Self Service Repair','قطع وأدلة حسب موديل المنتج','Model-specific parts and manuals','https://support.apple.com/self-service-repair','يوفر قطعًا وأدوات وأدلة أصلية لموديلات مؤهلة؛ القطع مصممة لكل منتج.','Provides genuine parts, tools and manuals for eligible models; parts are tailored per product.','مرجع رسمي للموديل المحدد وليس قاعدة توافق عامة.','Official for the specific model, not a general compatibility database.'],
['GSMArena','GSMArena','مواصفات الأجهزة','Device specifications','https://www.gsmarena.com/m/faq.php3','مفيد لمواصفات الهاتف. الموقع يوضح أن دوره معلومات الأجهزة ولا يقدم إصلاحًا.','Useful for phone specifications. The site says it provides device information, not repair services.','تشابه المواصفات لا يثبت توافق قطعة غيار.','Similar specifications do not establish spare-part compatibility.'],
['MobiMatch Pro','MobiMatch Pro','منهجية يذكرها الموقع ذاتيًا','Self-described methodology','https://www.mobimatchpro.com/about','يقول إنه يجمع البيانات من اختبار ورش وملصقات قطع الموردين وأرقام قطع الخدمة وأدلة التفكيك.','Says it compiles data from repair-lab tests, supplier labels, service part numbers and teardown guides.','المنهجية والتغطية معلنة من الموقع نفسه؛ يلزم فحص دليل كل سجل قبل اعتماده.','Methodology and coverage are self-reported; each record needs evidence review.']
];let cards=s.map(x=>`<article class="card source-card"><div class="source-top"><div><h3>${t(x[0],x[1])}</h3><span class="pill">${t(x[2],x[3])}</span></div><a class="btn" href="${x[4]}" onclick="return openSource(this.href)">${t('فتح المصدر ↗','Open source ↗')}</a></div><p>${t(x[5],x[6])}</p><div class="source-caveat"><b>${t('حدود الاعتماد:','Evidence limits:')}</b> ${t(x[7],x[8])}</div></article>`).join('');return `${head(t('مصادر البيانات والتحقق','Data sources & verification'),t('المراجع التي راجعناها وما الذي يثبته كل مصدر','Reviewed references and what each can establish'))}<div class="card source-intro"><b>${t('مراجعة المصادر: 1 نوفمبر 2026','Sources reviewed: 1 Nov 2026')}</b><p>${t('الأعداد والادعاءات منقولة عن المواقع نفسها. لم نستورد قواعد بياناتها أو نضف توافقات جديدة تلقائيًا.','Counts and claims are reported by the sites themselves. Their databases were not imported and no new fitments were added automatically.')}</p><div class="notice">${t('قائمة البائع ليست اختبارًا. افحص كود القطعة والنسخة والموصل والفريم. مواصفات GSMArena لا تثبت توافق القطعة.','A seller listing is not a test. Check part code, variant, connector and frame. GSMArena specifications do not prove fitment.')}</div></div><div class="source-grid">${cards}</div><div class="card"><h3>${t('درجات الدليل المقترحة','Suggested evidence levels')}</h3><div class="detailgrid"><div class="detailcell"><small>${t('رسمي / موثق','Official / documented')}</small><strong>${t('رقم قطعة أو دليل إصلاح يطابق موديل الجهاز.','Part number or repair manual matching the exact device model.')}</strong></div><div class="detailcell"><small>${t('مجرّب فنيًا','Technician tested')}</small><strong>${t('إصلاح فعلي موثق بالموديل وكود القطعة.','A real repair recorded with model and part code.')}</strong></div><div class="detailcell"><small>${t('مذكور لدى مورد','Supplier listed')}</small><strong>${t('ادعاء كتالوج بائع؛ منفصل عن الاختبار.','Seller catalog claim; separate from testing.')}</strong></div><div class="detailcell"><small>${t('غير مؤكد','Unconfirmed')}</small><strong>${t('لا يوجد دليل كافٍ؛ لا يعرض كتوصية تركيب.','Insufficient evidence; not shown as a repair recommendation.')}</strong></div></div></div>`}
function openSource(url){if(window.NativeApp?.openExternal){window.NativeApp.openExternal(url);return false}return true}
function openCompatibilityPortal(){if(window.NativeApp?.openCompatibilityPortal){window.NativeApp.openCompatibilityPortal();return false}window.open('https://mhtref.com/compatibilities/search','_blank','noopener');return false}
function openGsmaDirectory(){if(window.NativeApp?.openGsmaDirectory){window.NativeApp.openGsmaDirectory();return false}window.open('https://www.gsmarena.com/makers.php3','_blank','noopener');return false}
function openGsmaSearch(query=''){if(window.NativeApp?.openGsmaSearch){window.NativeApp.openGsmaSearch(String(query||''));return false}const url=query?'https://www.gsmarena.com/res.php3?sSearch='+encodeURIComponent(query):'https://www.gsmarena.com/';window.open(url,'_blank','noopener');return false}
function gsmArenaPortalCard(){const en=load('smp_language','ar')==='en';return `<div class="card"><div class="pagehead"><div><h2 style="font-size:15px">${en?'Full GSMArena device catalog':'كتالوج أجهزة GSMArena'}</h2><p>${en?'Browse devices by brand or search the live catalog for model specifications.':'تصفح أجهزة كل الشركات أو ابحث عن موديل ومواصفاته من قاعدة GSMArena مباشرة.'}</p></div></div><div class="actions"><button class="primary" type="button" onclick="openGsmaDirectory()">${en?'All brands and devices':'كل الشركات والأجهزة'}</button><button class="btn" type="button" onclick="openGsmaSearch('')">⌕ ${en?'Search a model':'بحث عن موديل'}</button></div><div class="subtle" style="margin-top:9px">${en?'Live data opens from GSMArena and requires an internet connection.':'البيانات تُفتح مباشرة من GSMArena وتحتاج إلى إنترنت.'} · <a href="https://www.gsmarena.com/terms.php3" onclick="return openSource(this.href)">${en?'Source terms':'شروط المصدر'}</a></div></div>`}
function compatibilityPortalCard(){let en=load('smp_language','ar')==='en';let title=en?'Expanded live compatibility catalog':'قاعدة التوافقات الموسعة';let detail=en?'Search 6,500+ phone models for display, screen protector, battery, fingerprint, charging socket and flex matches. Online catalog; counts are reported by its provider.':'ابحث عن توافقات الشاشات والاسكرينات والبطاريات والبصمات وسوكت وفلاتة الشحن عبر آلاف الموديلات. كتالوج مباشر يحتاج إنترنت؛ الأعداد حسب إحصائيات مزوده.';let action=en?'Open full catalog':'افتح البحث الكامل';return `<div class="card"><div class="pagehead"><div><h2 style="font-size:15px">${title}</h2><p>${detail}</p></div></div><button class="primary" type="button" onclick="openCompatibilityPortal()">⌕ ${action}</button><div class="subtle" style="margin-top:9px">المصدر / Source: Al-Mohtarif · mhtref.com</div></div>`}

const protectorGroupNames={"G1":"Oppo A15 / Samsung A12","G9":"Oppo A5s / Samsung A10","G10":"Oppo A1K / Realme C2","G12":"Samsung A35 / A55","G13":"Oppo Reno 4 / Reno 5","G14":"Infinix Note 10 Pro / Note 11 Pro","G15":"Infinix Hot 10s / Redmi 14C","G16":"Redmi Note 13 4G","G30":"Huawei P20 Lite","G31":"Realme 11 Pro Plus / شاشات منحنية Curved"};
function protectorBrandKey(value){return String(value||'').trim().toLowerCase()}
function protectorBrandModels(row,brand){const key=protectorBrandKey(brand);let models=row.brand&&protectorBrandKey(row.brand)===key?row.family.split(',').map(x=>x.trim()).filter(Boolean):[];(row.joker||'').split('|').forEach(part=>{const i=part.indexOf(':');if(i<0)return;if(protectorBrandKey(part.slice(0,i))===key)models.push(...part.slice(i+1).split(',').map(x=>x.trim()).filter(Boolean))});return [...new Set(models)]}
function protectorBrands(){const values=[];protectorGroups.forEach(row=>{if(row.brand)values.push(row.brand);(row.joker||'').split('|').forEach(part=>{const i=part.indexOf(':');if(i>0)values.push(part.slice(0,i).trim())})});return [...new Set(values)].sort((a,b)=>a.localeCompare(b))}
function protectorLookupPanel(){const en=load('smp_language','ar')==='en';const opts=protectorBrands().map(b=>'<option value="'+esc(b)+'">'+esc(b)+'</option>').join('');const title=en?'Screen protector matches':'بحث توافق الاسكرينات';const intro=en?'Choose the phone brand, type a model, then select it to see its protector group.':'اختار شركة الموبايل، واكتب الموديل، ثم اختاره عشان تظهر مجموعة الاسكرينة المتوافقة.';const empty=en?'Choose a brand and start typing a model.':'اختار الشركة وابدأ اكتب اسم الموديل.';const note=en?'These matches are for screen protectors, not display assemblies.':'التوافقات هنا للاسكرينات وواقيات الشاشة، مش لوحدات الشاشة واللمس.';return '<section class="card protector-lookup"><div class="pagehead"><div><h2 style="font-size:16px">'+title+'</h2><p>'+intro+'</p></div><span class="protector-counts"><span class="protector-count"><strong>'+protectorGroupCount()+'</strong>'+(en?'groups':'مجموعة')+'</span><span class="protector-count"><strong>'+protectorModelCount()+'</strong>'+(en?'models':'موديل')+'</span></span></div><div class="formgrid"><div class="formrow"><label for="protectorBrand">'+(en?'Brand':'الشركة')+'</label><select id="protectorBrand" onchange="setProtectorBrand()"><option value="">'+(en?'Choose brand':'اختار الشركة')+'</option>'+opts+'</select></div><div class="formrow"><label for="protectorQuery">'+(en?'Phone model':'موديل الهاتف')+'</label><input id="protectorQuery" class="field" autocomplete="off" placeholder="'+(en?'Example: A15 or Note 10 Pro':'مثال: A15 أو Note 10 Pro')+'" oninput="renderProtectorSuggestions(this.value)" onkeydown="if(event.key===\'Enter\'){event.preventDefault();selectFirstProtectorSuggestion()}"></div></div><div id="protectorSuggestions" class="protector-suggestions"><div class="empty">'+empty+'</div></div><div id="protectorResults"></div><div class="notice">'+note+'</div><div class="subtle protector-source">'+(en?'Source: Joker screen protector catalog · local snapshot':'المصدر: الجوكر للاسكرينات · نسخة محلية من البيانات')+' · '+protectorGroupCount()+' '+(en?'records':'مجموعة')+' · '+protectorModelCount()+' '+(en?'models':'موديل')+' · 1 نوفمبر 2026 · <a href="https://ma3loma-plus.com/%D8%A7%D9%84%D8%AC%D9%88%D9%83%D8%B1-%D9%84%D9%84%D8%A7%D8%B3%D9%83%D8%B1%D9%8A%D9%86%D8%A7%D8%AA-%D8%A7%D9%84%D9%85%D8%AD%D8%B1%D9%83-%D8%A7%D9%84%D8%A3%D8%B3%D8%B1%D8%B9-%D9%84%D9%84%D8%A8%D8%AD/" onclick="return openSource(this.href)">Ma3loma Plus</a></div></section>'}
function setProtectorBrand(){const q=document.getElementById('protectorQuery'),box=document.getElementById('protectorSuggestions'),res=document.getElementById('protectorResults');if(q)q.value='';if(res)res.innerHTML='';if(box)box.innerHTML='<div class="empty">'+(load('smp_language','ar')==='en'?'Type a model name.':'اكتب اسم الموديل.')+'</div>'}
function renderProtectorSuggestions(query){const brand=document.getElementById('protectorBrand')?.value||'',box=document.getElementById('protectorSuggestions');if(!box)return;const q=String(query||'').trim().toLowerCase();if(!brand||!q){box.innerHTML='<div class="empty">'+(load('smp_language','ar')==='en'?'Choose a brand and type a model.':'اختار الشركة واكتب الموديل.')+'</div>';return}const models=[...new Set(protectorGroups.flatMap(row=>protectorBrandModels(row,brand)))].filter(name=>name.toLowerCase().includes(q)).sort((a,b)=>a.localeCompare(b)).slice(0,20);if(!models.length){box.innerHTML='<div class="empty">'+(load('smp_language','ar')==='en'?'No matching models in the local catalog.':'الموديل مش موجود في قاعدة الاسكرينات المحلية.')+'</div>';return}box.innerHTML=models.map(name=>'<button class="protector-suggestion" type="button" data-model="'+esc(name)+'">'+esc(name)+' <span class="pill">'+esc(brand)+'</span></button>').join('');box.querySelectorAll('[data-model]').forEach(button=>button.addEventListener('click',()=>showProtectorMatches(brand,button.dataset.model)))}
function selectFirstProtectorSuggestion(){document.querySelector('#protectorSuggestions [data-model]')?.click()}
function showProtectorMatches(brand,model){const res=document.getElementById('protectorResults');if(!res)return;const matches=protectorGroups.filter(row=>protectorBrandModels(row,brand).some(name=>name.toLowerCase()===model.toLowerCase()));const rows=matches.map(row=>{const g=esc((row.group||'غير محدد').trim().toUpperCase());const order=esc(protectorGroupNames[(row.group||'').trim().toUpperCase()]||row.family.split(',')[0].trim()||'—');const brands=[{name:row.brand,models:row.family.split(',').map(x=>x.trim()).filter(Boolean)},...(row.joker||'').split('|').map(part=>{const i=part.indexOf(':');return i>0?{name:part.slice(0,i).trim(),models:part.slice(i+1).split(',').map(x=>x.trim()).filter(Boolean)}:null}).filter(Boolean)];const groupsHtml=brands.map(item=>'<div class="protector-brand-row"><b>'+esc(item.name)+'</b><div class="protector-chip-list">'+item.models.map(name=>'<span class="pill">'+esc(name)+'</span>').join('')+'</div></div>').join('');const total=brands.reduce((n,item)=>n+item.models.length,0);return '<article class="card protector-match"><div class="detailgrid"><div class="detailcell"><small>كود المجموعة</small><strong>'+g+'</strong></div><div class="detailcell"><small>اطلبها باسم</small><strong>'+order+'</strong></div></div><details class="protector-more"><summary>الموديلات المتوافقة ('+total+')</summary><div class="protector-brand-list">'+groupsHtml+'</div></details></article>'}).join('');res.innerHTML='<div class="card protector-selected"><strong>'+esc(brand)+' '+esc(model)+'</strong><div class="subtle">'+matches.length+' توافق/مجموعة في البيانات المنشورة</div></div>'+(rows||'<div class="empty">لم يتم العثور على مجموعة متوافقة لهذا الموديل.</div>')}
function protectorGroupCount(){return new Set(protectorGroups.filter(row=>row.group&&row.brand&&row.family).map(row=>row.group.trim().toUpperCase())).size}
function protectorModelCount(){return new Set(protectorGroups.flatMap(row=>[{brand:row.brand,models:row.family.split(',')},...(row.joker||'').split('|').map(part=>{const i=part.indexOf(':');return i>0?{brand:part.slice(0,i).trim(),models:part.slice(i+1).split(',')}:{brand:'',models:[]}})].flatMap(item=>item.models.filter(Boolean).map(model=>protectorBrandKey(item.brand)+'|'+model.trim().toLowerCase())))).size}
function categoryPage(){let filtered=data.filter(p=>p.category===activeFilter&&(!searchTerm||Object.values(p).join(' ').toLowerCase().includes(searchTerm.toLowerCase())));const subtitle=activeFilter==='واقيات الشاشة'?'ابحث عن موديل الهاتف لمعرفة مجموعة الاسكرينة المتوافقة':`نتائج قسم ${activeFilter}`;return `${head(activeFilter,subtitle,`<button class="btn" onclick="navigate('home')">كل الأقسام</button><button class="btn" onclick="navigate('search')">البحث العام</button>`)}${activeFilter==='واقيات الشاشة'?protectorLookupPanel():compatibilityPortalCard()}<div class="card"><div class="filters"><input class="field" id="localQuery" value="${esc(searchTerm)}" placeholder="بحث داخل القسم" oninput="setQuery(this.value)"><button class="btn" onclick="clearCategoryQuery()">مسح البحث</button></div><div class="subtle">${filtered.length} نتيجة</div>${listResults(filtered)}${demoNotice()}</div>`}
function clearCategoryQuery(){searchTerm='';render()}
function saveAccountForm(event){event.preventDefault();const form=new FormData(event.currentTarget);account={name:form.get('name').trim(),shop:form.get('shop').trim(),phone:form.get('phone').trim(),email:form.get('email').trim()};save('smp_account',account);showToast('تم حفظ بيانات الحساب على هذا الجهاز')}
function homePage(){let recent=[...data].sort((a,b)=>b.date.localeCompare(a.date)).slice(0,3);return `${head('الرئيسية','مرحبًا بك في دليل التوفيقات',`<button class="btn" onclick="navigate('report')">إبلاغ عن خطأ</button>`)}<div class="stats"><div class="stat"><strong>${data.length}</strong><span>توافقات بمصدر</span></div><div class="stat"><strong>${favorites.length}</strong><span>في المفضلة</span></div><div class="stat"><strong>${inventory.length}</strong><span>أصناف المخزون</span></div></div><div class="card"><div class="pagehead"><div><h2 style="font-size:14px">أقسام قطع الغيار</h2><p>اختر قسمًا لعرض نتائج المعاينة</p></div></div><div class="category-grid">${cats.map(c=>`<button class="btn category-tile" onclick="openCategory('${c}')"><span class="category-icon">${iconCat(c)}</span><span>${c}</span></button>`).join('')}</div></div>${compatibilityPortalCard()}<div class="card"><div class="pagehead"><div><h2 style="font-size:14px">آخر الإضافات</h2><p>أحدث سجلات العينة</p></div><button class="linkbtn btn" onclick="navigate('additions')">عرض الكل</button></div>${listResults(recent)}</div>${demoNotice()}`}
function searchPage(){let filtered=data.filter(p=>(activeFilter==='الكل'||p.category===activeFilter)&&(!searchTerm||Object.values(p).join(' ').toLowerCase().includes(searchTerm.toLowerCase())));return `${head('البحث الذكي',searchTerm?`نتائج البحث عن «${esc(searchTerm)}»`:'ابحث باسم الموديل أو كود القطعة أو الشركة',`<button class="btn" onclick="navigate('compare')">المقارنة (${compare.length}/2)</button><button class="btn" onclick="addCompatibilityForm()">＋ إضافة توفيق</button><button class="btn" onclick="exportCompatibility()">تصدير التوفيقات</button><label class="btn">استيراد JSON<input type="file" accept="application/json" hidden onchange="importCompatibility(this)"></label>`)}${compatibilityPortalCard()}<div class="card"><div class="filters"><select id="catFilter" onchange="setFilter(this.value)"><option>الكل</option>${cats.map(c=>`<option ${activeFilter===c?'selected':''}>${c}</option>`).join('')}</select><input class="field" id="localQuery" value="${esc(searchTerm)}" placeholder="اسم الموديل أو كود القطعة" oninput="setQuery(this.value)"><button class="btn" onclick="clearFilters()">مسح التصفية</button><button class="btn" onclick="navigate('code')">⌗ بحث بالكود</button><button class="btn" onclick="navigate('image')">▧ بحث بالصورة</button></div>${listResults(filtered)}${demoNotice()}</div>`}
function addCompatibilityForm(){openModal('إضافة توفيق للمراجعة',`<form id="compatform" class="formgrid"><div class="formrow"><label>اسم الجهاز</label><input class="field" name="model" required placeholder="اسم الشركة والموديل"></div><div class="formrow"><label>كود الموديل الدقيق</label><input class="field" name="deviceCode" required placeholder="مثال: RMX3686"></div><div class="formrow"><label>النسخة أو السوق</label><input class="field" name="region" placeholder="مثال: عالمي / مصر"></div><div class="formrow"><label>القسم</label><select name="category">${cats.map(c=>`<option>${esc(c)}</option>`).join('')}</select></div><div class="formrow"><label>اسم القطعة</label><input class="field" name="part" required></div><div class="formrow"><label>كود القطعة</label><input class="field" name="code" required></div><div class="formrow"><label>مصدر المعلومة</label><select name="sourceType"><option>كتالوج مورد</option><option>دليل الشركة</option><option>تجربة تركيب</option></select></div><div class="formrow"><label>رابط المصدر</label><input class="field" name="sourceUrl" type="url" required></div><div class="formrow full"><label>دليل التحقق (نتيجة تجربة، ملاحظة فنية، أو مرجع محدد)</label><textarea class="field" name="evidence" required></textarea></div><div class="formrow full"><button class="primary">حفظ للمراجعة</button></div></form>`);document.getElementById('compatform').onsubmit=e=>{e.preventDefault();let f=Object.fromEntries(new FormData(e.target));let row={id:'local-'+Date.now(),category:f.category,icon:iconCat(f.category),model:f.model.trim(),deviceCode:f.deviceCode.trim(),region:f.region.trim(),part:f.part.trim(),code:f.code.trim(),fit:'قيد المراجعة',level:'conditional',date:new Date().toISOString().slice(0,10),notes:f.sourceType+' — '+f.evidence.trim(),source:f.sourceType,url:f.sourceUrl.trim(),verified:false};data.unshift(row);persist();closeModal();current='search';render();showToast('أضيف التوفيق محليًا بحالة قيد المراجعة')}}
function exportCompatibility(){download(new Blob([JSON.stringify({data},null,2)],{type:'application/json'}),'smart-match-compatibility.json')}
function importCompatibility(input){let f=input.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result),rows=Array.isArray(x)?x:x.data;if(!Array.isArray(rows))throw Error('invalid');for(const row of rows){if(!row.model||!row.part||!row.code)continue;let i=data.findIndex(d=>d.id===row.id||(d.deviceCode&&d.deviceCode===row.deviceCode&&d.code===row.code));if(i<0)data.push(row);else data[i]=row}persist();render();showToast('تم استيراد التوفيقات')}catch{showToast('ملف غير صالح؛ استخدم JSON يحوي data')}};r.readAsText(f)}let gsmSearchMode='online',gsmSearchTerm='';
function setGsmMode(mode){gsmSearchMode=mode;render()}
function gsmSearchSubmit(){const input=document.getElementById('gsmQuery');gsmSearchTerm=(input?.value||gsmSearchTerm).trim();if(gsmSearchMode==='online'){if(!gsmSearchTerm){openGsmaDirectory();return}openGsmaSearch(gsmSearchTerm)}else{searchGsm(gsmSearchTerm)}}
function gsmManagementMenu(){const en=load('smp_language','ar')==='en';const title=en?'Manage GSM database':'إدارة قاعدة GSM';const add=en?'＋ Add a local model':'＋ إضافة موديل محلي';const exp=en?'⇩ Export local data':'⇩ تصدير البيانات المحلية';const imp=en?'⇧ Import JSON':'⇧ استيراد JSON';openModal(title,'<div class="results"><button class="btn more-link" onclick="closeModal();gsmForm()">'+add+'</button><button class="btn more-link" onclick="closeModal();exportGsm()">'+exp+'</button><label class="btn more-link">'+imp+'<input type="file" accept="application/json" hidden onchange="closeModal();importGsmData(this)"></label></div>')}
function gsmPage(){const en=load('smp_language','ar')==='en';const live=gsmSearchMode==='online';const subtitle=en?'Search GSMArena or your saved devices':'ابحث في GSMArena أو بين الأجهزة المحفوظة';const manage='⚙';const manageTitle=en?'Manage database':'إدارة القاعدة';const searchLabel=en?'Search':'بحث';const liveLabel=en?'GSMArena live':'GSMArena مباشر';const localLabel=en?'Saved locally':'محفوظة محليًا';const placeholder=en?'Phone name or model number':'اسم الجهاز أو كود الموديل';const directory=en?'Browse all brands and devices':'تصفح كل الشركات والأجهزة';const note=en?'Search opens live GSMArena results inside the app. Internet required.':'البحث يفتح نتائج GSMArena المباشرة داخل التطبيق ويحتاج إنترنت.';const localNote=en?'These are records saved on this device. Manage or import them as JSON.':'دي السجلات المحفوظة على الجهاز. تقدر تديرها أو تستوردها من ملف JSON.';const empty=en?'Enter a model name or code, then tap Search.':'اكتب اسم الموديل أو الكود واضغط بحث لعرض المواصفات من GSMArena.';const html=head('GSM',subtitle,'<button class="btn" aria-label="'+manageTitle+'" title="'+manageTitle+'" style="white-space:nowrap" onclick="gsmManagementMenu()">'+manage+'</button>')+'<div class="card"><div class="gsm-mode-tabs"><button class="'+(live?'primary':'btn')+'" type="button" onclick="setGsmMode(\'online\')">'+liveLabel+'</button><button class="'+(!live?'primary':'btn')+'" type="button" onclick="setGsmMode(\'local\')">'+localLabel+' ('+gsmDevices.length+')</button></div><form class="gsm-searchline" onsubmit="event.preventDefault();gsmSearchSubmit()"><input id="gsmQuery" class="field" value="'+esc(gsmSearchTerm)+'" placeholder="'+placeholder+'" autocomplete="off"><button class="primary" type="submit">'+searchLabel+' ⌕</button></form>'+(live?'<div class="actions" style="margin-top:11px"><button class="btn" type="button" onclick="openGsmaDirectory()">'+directory+' ↗</button></div><div class="subtle gsm-source-note">'+note+' · <a href="https://www.gsmarena.com/terms.php3" onclick="return openSource(this.href)">GSMArena</a></div>':'<div class="subtle gsm-source-note">'+localNote+'</div>')+'</div><div id="gsmResults">'+(live?'<div class="empty">'+empty+'</div>':gsmCards(gsmSearchTerm))+'</div>';return html}
function gsmCards(q){let term=(q||'').trim().toLowerCase(),matches=gsmDevices.filter(d=>!term||[d.code,d.name,d.brand,...(d.aliases||[])].join(' ').toLowerCase().includes(term));if(!matches.length)return '<div class="empty">لم نجد هذا الكود في قاعدة GSM بعد. أضف سجلًا موثقًا أو استورد قاعدة JSON.</div>';return `<div class="results">${matches.map(d=>`<article class="card gsmcard"><div class="pagehead"><div><h2 style="font-size:16px">${esc(d.name)}</h2><p>${esc(d.brand)} · كود الموديل: <b>${esc(d.code)}</b>${d.region?' · '+esc(d.region):''}</p></div><span class="badge confirmed">مواصفات مسجلة</span></div><div class="detailgrid">${d.specs.map(([label,value])=>`<div class="detailcell"><small>${esc(label)}</small><strong>${esc(value)}</strong></div>`).join('')}</div><div class="notice">المصدر: <a href="${esc(d.url)}" target="_blank" rel="noopener">${esc(d.source)}</a> · ${esc(d.verified||'يحتاج مراجعة')}</div></article>`).join('')}</div>`}
function searchGsm(q){gsmSearchTerm=q||'';let el=document.getElementById('gsmResults');if(el&&gsmSearchMode==='local'){el.innerHTML=gsmCards(gsmSearchTerm);translateUI()}}
function gsmForm(){openModal('إضافة موديل إلى GSM',`<form id="gsmform" class="formgrid"><div class="formrow"><label>كود الموديل الدقيق</label><input class="field" name="code" required placeholder="مثال: SM-A546U"></div><div class="formrow"><label>الشركة والموديل</label><input class="field" name="name" required placeholder="Samsung Galaxy ..."></div><div class="formrow"><label>السوق أو النسخة</label><input class="field" name="region" placeholder="مثال: مصر / عالمي / US"></div><div class="formrow"><label>المعالج</label><input class="field" name="chipset"></div><div class="formrow"><label>معالج الرسوميات (GPU)</label><input class="field" name="gpu"></div><div class="formrow"><label>الرام والتخزين</label><input class="field" name="memory" placeholder="8GB / 256GB"></div><div class="formrow"><label>الشاشة</label><input class="field" name="display" placeholder="النوع والمقاس والدقة والتحديث"></div><div class="formrow"><label>الكاميرات</label><input class="field" name="camera"></div><div class="formrow"><label>البطارية والشحن</label><input class="field" name="battery"></div><div class="formrow"><label>الاتصال والشبكات</label><input class="field" name="connectivity"></div><div class="formrow"><label>الأبعاد والوزن والحماية</label><input class="field" name="physical"></div><div class="formrow"><label>إصدار النظام</label><input class="field" name="os"></div><div class="formrow full"><label>رابط مصدر المواصفات</label><input class="field" name="url" type="url" required placeholder="رابط رسمي أو مرخّص"></div><div class="formrow full"><button class="primary">حفظ موديل GSM</button></div></form>`);document.getElementById('gsmform').onsubmit=e=>{e.preventDefault();let f=Object.fromEntries(new FormData(e.target));let specs=[['المعالج',f.chipset],['معالج الرسوميات',f.gpu],['الذاكرة والتخزين',f.memory],['الشاشة',f.display],['الكاميرات',f.camera],['البطارية والشحن',f.battery],['الاتصال والشبكات',f.connectivity],['الأبعاد والوزن والحماية',f.physical],['النظام',f.os]].filter(x=>x[1]);let item={code:f.code.trim(),region:f.region.trim(),aliases:[],brand:f.name.split(' ')[0],name:f.name.trim(),specs,source:'مصدر مضاف يدويًا',url:f.url.trim(),verified:'مصدر المستخدم — يلزم مراجعته'};let at=gsmDevices.findIndex(d=>d.code.toLowerCase()===item.code.toLowerCase());if(at>=0)gsmDevices[at]=item;else gsmDevices.unshift(item);persist();closeModal();render();showToast('تم حفظ الموديل في قاعدة GSM المحلية')}}
function exportGsm(){download(new Blob([JSON.stringify({devices:gsmDevices},null,2)],{type:'application/json'}),'smart-match-gsm-devices.json')}
function importGsmData(input){let f=input.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let parsed=JSON.parse(r.result),items=Array.isArray(parsed)?parsed:parsed.devices;if(!Array.isArray(items))throw Error('invalid');for(const item of items){if(!item.code||!item.name||!Array.isArray(item.specs))continue;let i=gsmDevices.findIndex(d=>d.code.toLowerCase()===String(item.code).toLowerCase());if(i<0)gsmDevices.push(item);else gsmDevices[i]=item}persist();render();showToast('تم استيراد سجلات GSM')}catch{showToast('ملف GSM غير صالح؛ استخدم JSON يحوي devices')}};r.readAsText(f)}function favoritesPage(){return `${head('المفضلة','التوفيقات التي حفظتها على هذا الجهاز',`<button class="btn" onclick="exportData()">تصدير نسخة</button>`)}<div class="card">${listResults(data.filter(p=>favorites.includes(p.id)))}</div>`}
function historyPage(){return `${head('آخر عمليات البحث','سجل محفوظ محليًا في هذا المتصفح',`<button class="btn" onclick="clearHistory()">مسح السجل</button>`)}<div class="card">${history.length?history.map((h,i)=>`<div class="result"><div class="particon">◷</div><div class="resultmain"><strong>${esc(h.q||'بحث بدون كلمات')}</strong><small>${esc(h.when)} · ${h.count} نتيجة</small></div><button class="btn" onclick="rerun(${i})">إعادة البحث</button></div>`).join(''):'<div class="empty">لا يوجد سجل بعد. جرّب البحث في أعلى الصفحة.</div>'}</div>`}
function comparePage(){let picks=compare.map(id=>data.find(p=>p.id===id)).filter(Boolean);return `${head('مقارنة القطع','اختر سجلين من النتائج لمقارنة التفاصيل',`<button class="btn" onclick="compare=[];persist();render()">إفراغ المقارنة</button>`)}<div class="card"><div class="subtle">${picks.length} من 2 محددين — استخدم زر ⇄ في بطاقة النتيجة لإضافة القطع.</div>${picks.length?`<div class="compatline"><span></span><b>مقارنة توضيحية</b><span></span></div><div class="detailgrid">${picks.map(p=>`<div class="detailcell"><small>الموديل</small><strong>${esc(p.model)}</strong></div><div class="detailcell"><small>القطعة</small><strong>${esc(p.part)}</strong></div><div class="detailcell"><small>الكود</small><strong>${esc(p.code)}</strong></div><div class="detailcell"><small>درجة التوافق</small><strong>${esc(p.fit)}</strong></div><div class="detailcell"><small>القسم</small><strong>${esc(p.category)}</strong></div><div class="detailcell"><small>ملاحظات</small><strong>${esc(p.notes)}</strong></div>`).join('')}</div>`:'<div class="empty">لم تختر قطعًا للمقارنة بعد. اذهب إلى البحث واضغط ⇄ بجوار نتيجتين.</div>'}${demoNotice()}</div>`}
function inventoryPage(){return `${head('إدارة المخزون','أضف القطع الموجودة عندك وكمياتها وأسعارها',`<button class="primary" onclick="inventoryForm()">＋ إضافة قطعة</button><button class="btn" onclick="exportInventory()">تصدير CSV</button>`)}<div class="stats"><div class="stat"><strong>${inventory.length}</strong><span>عدد الأصناف</span></div><div class="stat"><strong>${inventory.reduce((a,x)=>a+(+x.qty||0),0)}</strong><span>إجمالي الكمية</span></div><div class="stat"><strong>${inventory.reduce((a,x)=>a+(+x.qty||0)*(+x.price||0),0).toLocaleString('ar-EG')}</strong><span>قيمة تقريبية</span></div></div><div class="card"><div class="tablewrap"><table><thead><tr><th>القطعة</th><th>الكود</th><th>الكمية</th><th>السعر</th><th>إجراء</th></tr></thead><tbody>${inventory.map((x,i)=>`<tr><td>${esc(x.name)}</td><td>${esc(x.code||'—')}</td><td>${esc(x.qty)}</td><td>${esc(x.price||'—')}</td><td><button class="btn" onclick="inventoryForm(${i})">تعديل</button> <button class="btn" onclick="deleteInventory(${i})">حذف</button></td></tr>`).join('')||'<tr><td colspan="5" class="empty">المخزون فارغ. أضف قطعة للبدء.</td></tr>'}</tbody></table></div></div>`}

اخل التطبيق عند فتحه بعد موعد المراجعة</small></div><input class="switch" type="checkbox" ${reviewReminder.enabled?'checked':''} onchange="setReviewReminder(this.checked)"></div><div class="switchrow"><div><b>تكرار التذكير</b><small>يعمل عندما يكون التذكير مفعّلًا</small></div><select class="field" ${reviewReminder.enabled?'':'disabled'} onchange="setReviewInterval(this.value)"><option value="7" ${+reviewReminder.interval===7?'selected':''}>كل أسبوع</option><option value="30" ${+reviewReminder.interval===30?'selected':''}>كل شهر</option></select></div><div class="switchrow"><div><b>لغة الواجهة</b><small>اختار لغة العرض</small></div><select class="field" onchange="setLanguage(this.value)"><option value="ar" ${load('smp_language','ar')==='ar'?'selected':''}>العربية</option><option value="en" ${load('smp_language','ar')==='en'?'selected':''}>English</option></select></div></div><div class="card"><h3 style="font-size:13px;margin:0 0 9px">النسخ الاحتياطي والبيانات</h3><div class="actions"><button class="btn" onclick="exportData()">نسخة كاملة JSON</button><label class="btn">استعادة نسخة JSON<input type="file" accept="application/json" hidden onchange="importData(this)"></label><button class="btn" onclick="exportInventory()">تصدير المخزون CSV</button><button class="btn" onclick="window.print()">طباعة / حفظ PDF</button></div><p class="subtle">تشمل النسخة بيانات التوفيقات وGSM والإعدادات. تُحفظ البيانات على هذا الجهاز فقط؛ المزامنة السحابية غير مفعلة.</p></div><div class="card"><h3 style="font-size:13px;margin:0 0 7px">حول المعاينة</h3><div class="subtle">Smart Match Pro · نسخة معاينة 0.1 · قاعدة التوافق توضيحية، ولا توجد قاعدة موديلات كاملة أو خدمة تحديث سحابية.</div></div>`}
function additionsPage(){let items=[...data].sort((a,b)=>b.date.localeCompare(a.date));return `${head('آخر الإضافات','سجلات العينة مرتبة حسب تاريخ المراجعة',`<button class="btn" onclick="navigate('search')">البحث في السجلات</button>`)}<div class="card">${listResults(items)}</div>`}
function reportPage(){return `${head('الإبلاغ عن خطأ','أرسل ملاحظة على سجل توفيق داخل المعاينة',`<button class="btn" onclick="showToast('التقارير المحفوظة: '+reports.length)">بلاغاتي (${reports.length})</button>`)}<div class="card"><form id="reportForm" class="formgrid"><div class="formrow"><label>الموديل</label><input class="field" name="model" required placeholder="اسم الموديل"></div><div class="formrow"><label>كود القطعة (اختياري)</label><input class="field" name="code" placeholder="كود القطعة"></div><div class="formrow full"><label>وصف الملاحظة</label><textarea class="field" name="note" required placeholder="ما المعلومة التي تحتاج مراجعة؟"></textarea></div><div class="formrow full"><button class="primary">حفظ البلاغ في هذه المعاينة</button></div></form><div class="notice">الإرسال هنا محلي داخل المتصفح، ولا يصل إلى فريق دعم أو خادم.</div></div>`}
function codePage(){return `${head('البحث بالكود','ابحث برقم القطعة أو الباركود',`<button class="btn" onclick="navigate('search')">بحث عام</button>`)}<div class="card"><div class="filters"><input id="codequery" class="field" placeholder="أدخل كود القطعة أو امسح الباركود" style="flex:1"><button class="primary" onclick="codeSearch()">بحث بالكود</button></div><div id="codeResults"></div><div class="notice">قارئ الباركود الفعلي يحتاج صلاحية الكاميرا. هذه المعاينة توفر إدخال الكود يدويًا.</div></div>`}
function imagePage(){return `${head('البحث بالصورة','حمّل صورة قطعة لتجربة تدفق اقتراح النتائج',`<button class="btn" onclick="navigate('search')">البحث النصي</button>`)}<div class="card"><div class="filebox"><p>اختر صورة القطعة من جهازك</p><input id="imagefile" type="file" accept="image/*" onchange="previewImage(this)"><div id="imagepreview" style="margin-top:10px"></div></div><div class="actions" style="margin-top:12px"><button class="primary" onclick="imageSuggest()">اقترح نتائج تجريبية</button></div><div id="imageResults"></div><div class="notice">التعرف الذكي على الصورة غير موصول في المعاينة. الاقتراحات أدناه أمثلة ثابتة للتجربة ولا تعتمد على محتوى الصورة.</div></div>`}
function detail(id){let p=data.find(x=>x.id===id);if(!p)return;let body=`<div class="detailgrid"><div class="detailcell"><small>الموديل المطلوب</small><strong>${esc(p.model)}</strong></div><div class="detailcell"><small>القطعة البديلة</small><strong>${esc(p.part)}</strong></div><div class="detailcell"><small>درجة التوافق</small><strong>${esc(p.fit)}</strong></div><div class="detailcell"><small>كود موديل الجهاز</small><strong>${esc(p.deviceCode||'غير مسجل')}</strong></div><div class="detailcell"><small>النسخة أو السوق</small><strong>${esc(p.region||'غير محدد')}</strong></div><div class="detailcell"><small>كود القطعة</small><strong>${esc(p.code)}</strong></div><div class="detailcell"><small>آخر مراجعة</small><strong>${esc(p.date)}</strong></div><div class="detailcell"><small>مصدر التوفيق</small><strong>${esc(p.source||'بيانات تجريبية')}</strong></div></div><div class="notice">${esc(p.notes||'لا توجد ملاحظات.')}${p.url?' · <a href="'+esc(p.url)+'" target="_blank" rel="noopener">فتح المصدر</a>':''}</div><div class="actions" style="margin-top:12px"><button class="btn" onclick="toggleFav('${p.id}');detail('${p.id}')">☆ المفضلة</button><button class="btn" onclick="sharePart('${p.id}')">مشاركة</button><button class="btn" onclick="navigate('report')">إبلاغ عن خطأ</button></div>${demoNotice()}`;openModal('تفاصيل التوافق',body);history.unshift({q:p.model+' · '+p.code,when:new Date().toLocaleString('ar-EG'),count:1,id:p.id});history=history.slice(0,30);persist()}
function openModal(t,b){document.getElementById('modaltitle').textContent=t;document.getElementById('modalbody').innerHTML=b;document.getElementById('modalback').classList.add('show');translateUI()}function closeModal(){document.getElementById('modalback').classList.remove('show')}
function toggleFav(id){favorites=favorites.includes(id)?favorites.filter(x=>x!==id):[...favorites,id];persist();render();showToast(favorites.includes(id)?'أضيفت للمفضلة':'أزيلت من المفضلة')}
function toggleCompare(id){if(compare.includes(id))compare=compare.filter(x=>x!==id);else if(compare.length>=2){showToast('المقارنة تسمح بقطعتين فقط');return}else compare.push(id);persist();render();showToast(compare.includes(id)?'أضيفت للمقارنة':'أزيلت من المقارنة')}
function setFilter(v){activeFilter=v;render()}function setQuery(v){searchTerm=v;const pos=document.getElementById('localQuery')?.selectionStart;render();const q=document.getElementById('localQuery');if(q){q.focus();q.setSelectionRange(pos,pos)}}function clearFilters(){activeFilter='الكل';searchTerm='';render()}
function doSearch(q){searchTerm=q.trim();activeFilter='الكل';if(searchTerm){let c=data.filter(p=>Object.values(p).join(' ').toLowerCase().includes(searchTerm.toLowerCase())).length;history.unshift({q:searchTerm,when:new Date().toLocaleString('ar-EG'),count:c});history=history.slice(0,30);persist()}current='search';render();window.scrollTo({top:0,behavior:'smooth'})}
document.getElementById('searchForm').addEventListener('submit',e=>{e.preventDefault();doSearch(document.getElementById('query').value)});
function clearHistory(){history=[];persist();render();showToast('تم مسح سجل البحث')};function rerun(i){doSearch(history[i]?.q||'')}
function codeSearch(){let q=document.getElementById('codequery').value.trim(), hits=data.filter(p=>p.code.toLowerCase().includes(q.toLowerCase()));document.getElementById('codeResults').innerHTML=q?listResults(hits):'<div class="empty">أدخل كودًا للبحث.</div>';if(q){history.unshift({q:'كود: '+q,when:new Date().toLocaleString('ar-EG'),count:hits.length});history=history.slice(0,30);persist()}translateUI()}
function previewImage(input){let f=input.files[0],el=document.getElementById('imagepreview');if(!f)return;let u=URL.createObjectURL(f);el.innerHTML=`<img src="${u}" alt="صورة القطعة" style="max-width:180px;max-height:150px;border-radius:12px;object-fit:contain">`;}
function imageSuggest(){let el=document.getElementById('imageResults');if(!document.getElementById('imagefile').files.length){showToast('اختر صورة أولًا');return}let picks=data.slice(0,2);el.innerHTML=`<div class="compatline"><span></span><b>اقتراحات تجريبية</b><span></span></div>${listResults(picks)}`;translateUI()}
function inventoryForm(i=-1){let x=i>=0?inventory[i]:{name:'',code:'',qty:'',price:''};openModal(i>=0?'تعديل صنف':'إضافة صنف للمخزون',`<form id="invform" class="formgrid"><div class="formrow"><label>اسم القطعة</label><input class="field" name="name" required value="${esc(x.name)}"></div><div class="formrow"><label>الكود</label><input class="field" name="code" value="${esc(x.code)}"></div><div class="formrow"><label>الكمية</label><input class="field" name="qty" type="number" min="0" required value="${esc(x.qty)}"></div><div class="formrow"><label>السعر</label><input class="field" name="price" type="number" min="0" step="0.01" value="${esc(x.price)}"></div><div class="formrow full"><button class="primary">حفظ الصنف</button></div></form>`);document.getElementById('invform').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target),item=Object.fromEntries(f);if(i>=0)inventory[i]=item;else inventory.push(item);persist();closeModal();render();showToast('تم حفظ الصنف')}}
function deleteInventory(i){inventory.splice(i,1);persist();render();showToast('تم حذف الصنف')}
function simulateUpdate(){let b=document.getElementById('progressbar'),s=document.getElementById('updatestatus');b.style.width='35%';s.textContent='جارٍ فحص بيانات المعاينة...';setTimeout(()=>b.style.width='72%',450);setTimeout(()=>{b.style.width='100%';s.textContent='اكتمل الفحص — لا توجد تحديثات فعلية. هذه محاكاة محلية.';showToast('اكتمل فحص المعاينة')},1100)}
function applySystemStatusBar(){if(!window.NativeApp?.setStatusBarColor)return;const theme=load('smp_theme','blue'),mode=load('smp_appearance',load('smp_dark',false)?'dark':'light'),colors={blue:'#1559d5',turquoise:'#128f9c',sage:'#327e5e',purple:'#7432a5',red:'#b63753',orange:'#b6531d',charcoal:'#525d6d'},color=mode==='black'?'#050505':(colors[theme]||colors.blue);window.NativeApp.setStatusBarColor(color,false)}
function setAppearance(mode){save('smp_appearance',mode);save('smp_dark',mode!=='light');applyAppearance();render()}function applyAppearance(){let mode=load('smp_appearance',load('smp_dark',false)?'dark':'light');document.body.classList.toggle('dark',mode!=='light');document.body.classList.toggle('black-mode',mode==='black');applySystemStatusBar()}
function applyTheme(theme=load('smp_theme','blue')){let valid=themeOptions.some(x=>x[0]===theme)?theme:'blue';document.body.dataset.theme=valid;save('smp_theme',valid);applySystemStatusBar()}function setTheme(theme){applyTheme(theme);render();showToast('تم تطبيق الثيم وحفظه')}function setGlass(enabled){save('smp_glass',enabled);document.body.classList.toggle('glass-ui',enabled)}function setMotionOff(enabled){save('smp_motion_off',enabled);document.body.classList.toggle('motion-off',enabled)}
function applyFontSize(){let size=load('smp_font_size','medium');document.body.classList.toggle('font-small',size==='small');document.body.classList.toggle('font-large',size==='large')}function setFontSize(size){save('smp_font_size',size);applyFontSize();showToast('تم حفظ حجم النص')}
function setReviewReminder(enabled){reviewReminder={...reviewReminder,enabled,interval:+reviewReminder.interval||7,next:Date.now()+(+reviewReminder.interval||7)*86400000};save('smp_review_reminder',reviewReminder);render();showToast(enabled?'تم تفعيل التذكير داخل التطبيق':'تم إيقاف التذكير')}function setReviewInterval(days){reviewReminder={...reviewReminder,interval:+days,next:Date.now()+(+days)*86400000};save('smp_review_reminder',reviewReminder);showToast('تم تحديث موعد التذكير')}function checkReviewReminder(){if(reviewReminder.enabled&&reviewReminder.next&&Date.now()>=reviewReminder.next){showToast('حان موعد مراجعة سجلات التوافق ومصادرها');reviewReminder.next=Date.now()+(+reviewReminder.interval||7)*86400000;save('smp_review_reminder',reviewReminder)}}
function exportData(){let blob=new Blob([JSON.stringify({schemaVersion:2,exportedAt:new Date().toISOString(),data,favorites,history,inventory,reports,compare,gsmDevices,preferences:{dark:load('smp_dark',false),appearance:load('smp_appearance',load('smp_dark',false)?'dark':'light'),theme:load('smp_theme','blue'),fontSize:load('smp_font_size','medium'),glass:load('smp_glass',false),motionOff:load('smp_motion_off',false),reviewReminder}},null,2)],{type:'application/json'});download(blob,'smart-match-pro-backup.json');showToast('تم تنزيل النسخة الاحتياطية')}
function exportInventory(){let rows=[['القطعة','الكود','الكمية','السعر'],...inventory.map(x=>[x.name,x.code,x.qty,x.price])];download(new Blob(['\ufeff'+rows.map(r=>r.map(v=>'"'+String(v??'').replaceAll('"','""')+'"').join(',')).join('\n')],{type:'text/csv;charset=utf-8'}),'smart-match-inventory.csv')}
function download(blob,name){let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function importData(input){let f=input.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result);data=x.data||data;favorites=x.favorites||[];history=x.history||[];inventory=x.inventory||[];reports=x.reports||[];compare=x.compare||[];if(Array.isArray(x.gsmDevices))gsmDevices=x.gsmDevices;if(x.preferences){save('smp_dark',!!x.preferences.dark);save('smp_appearance',x.preferences.appearance||(x.preferences.dark?'dark':'light'));save('smp_theme',x.preferences.theme||'blue');save('smp_font_size',x.preferences.fontSize||'medium');save('smp_glass',!!x.preferences.glass);save('smp_motion_off',!!x.preferences.motionOff);if(x.preferences.reviewReminder){reviewReminder=x.preferences.reviewReminder;save('smp_review_reminder',reviewReminder)}applyAppearance();applyTheme(x.preferences.theme||'blue');applyFontSize();document.body.classList.toggle('glass-ui',!!x.preferences.glass);document.body.classList.toggle('motion-off',!!x.preferences.motionOff)}persist();render();showToast('تم استعادة النسخة')}catch{showToast('تعذر قراءة ملف النسخة')}};r.readAsText(f)}
function resetDemo(){if(!confirm('استعادة سجلات المعاينة الأصلية ومسح بياناتك المحلية؟'))return;data=initial;favorites=[];history=[];inventory=[];reports=[];compare=[];persist();render();showToast('تمت استعادة بيانات المعاينة')}
function sharePart(id){let p=data.find(x=>x.id===id),txt=`${p.model} — ${p.part} (${p.code})\n${p.fit}\nمعلومة تجريبية للمعاينة وليست توصية تركيب.`;if(navigator.share)navigator.share({title:'Smart Match Pro',text:txt}).catch(()=>{});else navigator.clipboard?.writeText(txt).then(()=>showToast('تم نسخ تفاصيل النتيجة'))||showToast('المشاركة غير متاحة في هذا المتصفح')}
document.addEventListener('submit',e=>{if(e.target.id==='reportForm'){e.preventDefault();let f=new FormData(e.target);reports.unshift({...Object.fromEntries(f),date:new Date().toLocaleString('ar-EG')});persist();e.target.reset();showToast('تم حفظ البلاغ محليًا في المعاينة')}});
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
applyAppearance();applyTheme();applyFontSize();document.body.classList.toggle('glass-ui',load('smp_glass',false));document.body.classList.toggle('motion-off',load('smp_motion_off',false));render();checkReviewReminder();
</script>
</body></html>
