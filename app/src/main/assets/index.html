function translateText(s){const lang=load('smp_language','ar'),q=String(s).trim();let v=lang==='en'?englishUI[q]:Object.entries(englishUI).find(([,en])=>en===q)?.[0];if(!v&&lang==='en'&&q.startsWith('نتائج قسم '))v='Results for '+(englishUI[q.slice(10)]||q.slice(10));if(!v&&lang==='en'&&/^\d+ نتيجة$/.test(q))v=q.replace(' نتيجة',' results');return v?String(s).replace(q,v):s}function translateUI(){const lang=load('smp_language','ar');document.documentElement.lang=lang;document.documentElement.dir=lang==='en'?'ltr':'rtl';document.body.classList.toggle('english',lang==='en');const w=document.createTreeWalker(document.body,NodeFilter.SHOW_TEXT);while(w.nextNode()){const n=w.currentNode;n.nodeValue=translateText(n.nodeValue)}document.querySelectorAll('[placeholder],[title],[aria-label]').forEach(e=>['placeholder','title','aria-label'].forEach(a=>{if(e.hasAttribute(a))e.setAttribute(a,translateText(e.getAttribute(a)))}))}function setLanguage(lang){save('smp_language',lang==='en'?'en':'ar');render();showToast(lang==='en'?'Language changed to English':'تم تغيير اللغة إلى العربية')}

function groupedSearchResults(items){if(!items.length)return '';const groups=[];for(const item of items){const codes=new Set((String(item.deviceCode||'').toUpperCase().match(/[A-Z]{2,}[0-9]{3,}/g)||[]));const group=groups.find(g=>[...g.sharedCodes].some(code=>codes.has(code)));if(!group){groups.push({items:[item],sharedCodes:codes});continue}group.items.push(item);group.sharedCodes=new Set([...group.sharedCodes].filter(code=>codes.has(code)))}return groups.map(group=>group.items.length<2?`<div class="results">${resultCard(group.items[0])}</div>`:`<section class="card search-result-group"><div class="search-result-group-head"><div><strong>مجموعة موديلات متقاربة</strong><small>${[...group.sharedCodes].join(' · ')}</small></div><span class="pill">${group.items.length} توفيقات</span></div><div class="results">${group.items.map(item=>resultCard(item)).join('')}</div></section>`).join('')}

item={code:f.code.trim(),region:f.region.trim(),aliases:[],brand:f.name.split(' ')[0],name:f.name.trim(),specs,source:'مصدر مضاف يدويًا',url:f.url.trim(),verified:'مصدر المستخدم — يلزم مراجعته'};let at=gsmDevices.findIndex(d=>d.code.toLowerCase()===item.code.toLowerCase());if(at>=0)gsmDevices[at]=item;else gsmDevices.unshift(item);persist();closeModal();render();showToast(cloudSession?'تم حفظ الموديل في بيانات حسابك على الخادم':'سجّل الدخول لحفظ موديل GSM على الخادم')}}

function importGsmData(input){let f=input.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let parsed=JSON.parse(r.result),items=Array.isArray(parsed)?parsed:parsed.devices;if(!Array.isArray(items))throw Error('invalid');for(const item of items){if(!item.code||!item.name||!Array.isArray(item.specs))continue;let i=gsmDevices.findIndex(d=>d.code.toLowerCase()===String(item.code).toLowerCase());if(i<0)gsmDevices.push(item);else gsmDevices[i]=item}persist();render();showToast('تم استيراد سجلات GSM')}catch{showToast('ملف GSM غير صالح؛ استخدم JSON يحوي devices')}};r.readAsText(f)}function favoritesPage(){return `${head('المفضلة','التوفيقات التي حفظتها على هذا الجهاز',`<button class="btn" onclick="exportData()">تصدير نسخة</button>`)}<div class="card">${listResults(data.filter(p=>favorites.includes(p.id)))}</div>`}

function deleteInventory(i){inventory.splice(i,1);persist();render();showToast('تم حذف الصنف')}
function simulateUpdate(){let b=document.getElementById('progressbar'),s=document.getElementById('updatestatus');b.style.width='35%';s.textContent='جارٍ فحص بيانات المعاينة...';setTimeout(()=>b.style.width='72%',450);setTimeout(()=>{b.style.width='100%';s.textContent='اكتمل الفحص — لا توجد تحديثات فعلية. هذه محاكاة محلية.';showToast('اكتمل فحص المعاينة')},1100)}
function applySystemStatusBar(){if(!window.NativeApp?.setStatusBarColor)return;const theme=load('smp_theme','blue'),mode=load('smp_appearance',load('smp_dark',false)?'dark':'light'),colors={blue:'#1559d5',turquoise:'#128f9c',sage:'#327e5e',purple:'#7432a5',red:'#b63753',orange:'#b6531d',charcoal:'#525d6d'},color=mode==='black'?'#050505':mode==='dark'?'#141b26':(colors[theme]||colors.blue);window.NativeApp.setStatusBarColor(color,false)}
function appearancePress(button,pressed){if(!button)return;clearTimeout(button._appearanceRippleTimer);if(pressed){button.classList.remove('released');button.classList.add('pressed');return}button.classList.remove('pressed');button.classList.remove('released');void button.offsetWidth;button.classList.add('released');button._appearanceRippleTimer=setTimeout(()=>button.classList.remove('released'),420)}function setAppearance(mode){save('smp_appearance',mode);save('smp_dark',mode!=='light');applyAppearance();render()}function toggleAppearanceShortcut(){setAppearance(document.body.classList.contains('dark')?'light':'dark')}function applyAppearance(){let mode=load('smp_appearance',load('smp_dark',false)?'dark':'light');document.body.classList.toggle('dark',mode!=='light');document.body.classList.toggle('black-mode',mode==='black');applySystemStatusBar();const shortcut=document.getElementById('appearanceShortcut'),isDark=mode!=='light';if(shortcut){shortcut.innerHTML='<span class="appearance-icon" aria-hidden="true">'+(isDark?'☀':'☾')+'</span>';shortcut.setAttribute('aria-label',isDark?'تفعيل الوضع الفاتح':'تفعيل الوضع الداكن');shortcut.title=isDark?'تفعيل الوضع الفاتح':'تفعيل الوضع الداكن'}}
function applyTheme(theme=load('smp_theme','blue')){let valid=themeOptions.some(x=>x[0]===theme)?theme:'blue';document.body.dataset.theme=valid;save('smp_theme',valid);applySystemStatusBar()}function setTheme(theme){applyTheme(theme);render();showToast('تم تطبيق الثيم وحفظه')}function setGlass(enabled){save('smp_glass',enabled);document.body.classList.toggle('glass-ui',enabled)}function setMotionOff(enabled){save('smp_motion_off',enabled);document.body.classList.toggle('motion-off',enabled)}
function applyFontSize(){let size=load('smp_font_size','medium');document.body.classList.toggle('font-small',size==='small');document.body.classList.toggle('font-large',size==='large')}function setFontSize(size){save('smp_font_size',size);applyFontSize();showToast('تم حفظ حجم النص')}
function setReviewReminder(enabled){reviewReminder={...reviewReminder,enabled,interval:+reviewReminder.interval||7,next:Date.now()+(+reviewReminder.interval||7)*86400000};save('smp_review_reminder',reviewReminder);render();showToast(enabled?'تم تفعيل التذكير داخل التطبيق':'تم إيقاف التذكير')}function setReviewInterval(days){reviewReminder={...reviewReminder,interval:+days,next:Date.now()+(+days)*86400000};save('smp_review_reminder',reviewReminder);showToast('تم تحديث موعد التذكير')}function checkReviewReminder(){if(reviewReminder.enabled&&reviewReminder.next&&Date.now()>=reviewReminder.next){showToast('حان موعد مراجعة سجلات التوافق ومصادرها');reviewReminder.next=Date.now()+(+reviewReminder.interval||7)*86400000;save('smp_review_reminder',reviewReminder)}}
function exportData(){let blob=new Blob([JSON.stringify({schemaVersion:2,exportedAt:new Date().toISOString(),data,favorites,history,inventory,reports,compare,gsmDevices,preferences:{dark:load('smp_dark',false),appearance:load('smp_appearance',load('smp_dark',false)?'dark':'light'),theme:load('smp_theme','blue'),fontSize:load('smp_font_size','medium'),glass:load('smp_glass',false),motionOff:load('smp_motion_off',false),reviewReminder}},null,2)],{type:'application/json'});download(blob,'smart-match-pro-backup.json');showToast('تم تنزيل النسخة الاحتياطية')}
function exportInventory(){let rows=[['القطعة','الكود','الكمية','السعر'],...inventory.map(x=>[x.name,x.code,x.qty,x.price])];download(new Blob(['\ufeff'+rows.map(r=>r.map(v=>'"'+String(v??'').replaceAll('"','""')+'"').join(',')).join('\n')],{type:'text/csv;charset=utf-8'}),'smart-match-inventory.csv')}
function download(blob,name){let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function importData(input){let f=input.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result);data=x.data||data;favorites=x.favorites||[];history=x.history||[];inventory=x.inventory||[];reports=x.reports||[];compare=x.compare||[];if(Array.isArray(x.gsmDevices))gsmDevices=x.gsmDevices;if(x.preferences){save('smp_dark',!!x.preferences.dark);save('smp_appearance',x.preferences.appearance||(x.preferences.dark?'dark':'light'));save('smp_theme',x.preferences.theme||'blue');save('smp_font_size',x.preferences.fontSize||'medium');save('smp_glass',!!x.preferences.glass);save('smp_motion_off',!!x.preferences.motionOff);if(x.preferences.reviewReminder){reviewReminder=x.preferences.reviewReminder;save('smp_review_reminder',reviewReminder)}applyAppearance();applyTheme(x.preferences.theme||'blue');applyFontSize();document.body.classList.toggle('glass-ui',!!x.preferences.glass);document.body.classList.toggle('motion-off',!!x.preferences.motionOff)}persist();render();showToast('تم استعادة النسخة')}catch{showToast('تعذر قراءة ملف النسخة')}};r.readAsText(f)}
function resetDemo(){if(!confirm('استعادة سجلات المعاينة الأصلية ومسح بياناتك المحلية؟'))return;data=initial;favorites=[];history=[];inventory=[];reports=[];compare=[];persist();render();showToast('تمت استعادة بيانات المعاينة')}
function sharePart(id){let p=data.find(x=>x.id===id),txt=`${p.model} — ${p.part} (${p.code})\n${p.fit}\nمعلومة تجريبية للمعاينة وليست توصية تركيب.`;if(navigator.share)navigator.share({title:'Smart Match Pro',text:txt}).catch(()=>{});else navigator.clipboard?.writeText(txt).then(()=>showToast('تم نسخ تفاصيل النتيجة'))||showToast('المشاركة غير متاحة في هذا المتصفح')}
document.addEventListener('submit',e=>{if(e.target.id==='reportForm'){e.preventDefault();let f=new FormData(e.target);reports.unshift({...Object.fromEntries(f),date:new Date().toLocaleString('ar-EG')});persist();e.target.reset();showToast(cloudSession?'تم حفظ البلاغ في حسابك على الخادم':'سجّل الدخول لحفظ البلاغ على الخادم')}});
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
applyAppearance();applyTheme();applyFontSize();document.body.classList.toggle('glass-ui',load('smp_glass',false));document.body.classList.toggle('motion-off',load('smp_motion_off',false));render();checkReviewReminder();initializeCloud();
</script>
</body></html>
